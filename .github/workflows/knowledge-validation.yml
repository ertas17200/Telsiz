name: Knowledge Validation

on:
  push:
    branches:
      - main
      - "bootstrap/**"
      - "knowledge/**"
      - "feat/**"
      - "ci/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Evidence runner and exact head
        run: |
          set -euo pipefail
          if [ -z "${RUNNER_NAME:-}" ]; then
            echo "TELSiZ_RUNNER_IDENTITY=HOLD reason=RUNNER_NAME_EMPTY"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "TELSiZ_EXACT_HEAD=HOLD expected=$EXPECTED_SHA actual=$actual"
            exit 1
          fi
          if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            echo "TELSiZ_WORKTREE=HOLD reason=DIRTY_AFTER_CHECKOUT"
            git status --short
            exit 1
          fi
          echo "TELSiZ_RUNNER_IDENTITY=PASS name=$RUNNER_NAME os=$RUNNER_OS arch=$RUNNER_ARCH"
          echo "TELSiZ_EXACT_HEAD=PASS sha=$actual"
          echo "TELSiZ_WORKTREE=PASS"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check tracked cache artifacts
        run: python scripts/check_repo_hygiene.py

      - name: Validate knowledge registries
        run: python scripts/validate_knowledge.py

      - name: Validate BTK raw transcription
        run: python scripts/validate_btk_raw.py

      - name: Validate BTK frequency scope index
        run: python scripts/validate_frequency_scope.py

      - name: Validate official artifact registry
        run: python scripts/artifact_gate.py validate-registry

      - name: Validate BTK semantic promotion readiness
        run: python scripts/validate_semantic_promotion.py

      - name: Validate academy manifest
        run: python scripts/validate_academy.py

      - name: Validate grounded practice exam
        run: python scripts/validate_exam.py

      - name: Validate Morse data
        run: python scripts/validate_morse.py

      - name: Validate Q-code and RST data
        run: python scripts/validate_operator_codes.py

      - name: Validate QSO log and ADIF contract
        run: python scripts/validate_qso_log.py

      - name: Validate RF wavelength calculator
        run: python scripts/validate_rf_calculator.py

      - name: Validate device manual and firmware registry
        run: python scripts/validate_device_manuals.py

      - name: Validate repeater operational snapshot
        run: python scripts/validate_repeaters.py

      - name: Validate bilingual documentation
        run: python scripts/validate_translations.py

      - name: Test grounding contract
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify final exact head and clean worktree
        if: always()
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "TELSiZ_FINAL_EXACT_HEAD=HOLD expected=$EXPECTED_SHA actual=$actual"
            exit 1
          fi
          if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            echo "TELSiZ_FINAL_WORKTREE=HOLD reason=DIRTY"
            git status --short
            exit 1
          fi
          echo "TELSiZ_FINAL_EXACT_HEAD=PASS sha=$actual"
          echo "TELSiZ_FINAL_WORKTREE=PASS"
