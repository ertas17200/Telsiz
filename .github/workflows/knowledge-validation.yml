name: Knowledge Validation

on:
  push:
    branches:
      - main
      - "bootstrap/**"
      - "knowledge/**"
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate knowledge registries
        run: python scripts/validate_knowledge.py

      - name: Test grounding contract
        run: python -m unittest discover -s tests -p "test_*.py" -v
