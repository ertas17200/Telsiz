name: Knowledge Validation

on:
  push:
    branches:
      - main
      - "bootstrap/**"
      - "knowledge/**"
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tracked cache artifacts
        run: python scripts/check_repo_hygiene.py

      - name: Validate knowledge registries
        run: python scripts/validate_knowledge.py

      - name: Validate BTK raw transcription
        run: python scripts/validate_btk_raw.py

      - name: Validate official artifact registry
        run: python scripts/artifact_gate.py validate-registry

      - name: Validate academy manifest
        run: python scripts/validate_academy.py

      - name: Validate grounded practice exam
        run: python scripts/validate_exam.py

      - name: Validate Morse data
        run: python scripts/validate_morse.py

      - name: Validate Q-code and RST data
        run: python scripts/validate_operator_codes.py

      - name: Validate QSO log and ADIF contract
        run: python scripts/validate_qso_log.py

      - name: Validate RF wavelength calculator
        run: python scripts/validate_rf_calculator.py

      - name: Validate device manual and firmware registry
        run: python scripts/validate_device_manuals.py

      - name: Validate repeater operational snapshot
        run: python scripts/validate_repeaters.py

      - name: Test grounding contract
        run: python -m unittest discover -s tests -p "test_*.py" -v
